version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build: .
    command: node --experimental-modules --experimental-loader=node:module --enable-source-maps server.js
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=production
      - VECTOR_DISTANCE=COSINE
      - BATCH_SIZE=50
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:

networks:
  rag-network:
    driver: bridge
